{{define "content"}}
<div class="page-header">
  <div class="ph-titles">
    <span class="ph-eyebrow">Infrastructure</span>
    <h1>{{.Heading}}</h1>
  </div>
</div>
{{if .Error}}<div class="error" role="alert" tabindex="-1">{{.Error}}</div>{{end}}
<form class="stack" method="post" action="{{.Action}}">
{{ csrfField }}
<input type="hidden" name="return_to" value="{{.ReturnURL}}">
  <label>Name<input name="name" value="{{.Item.Name}}" required></label>
  <label>Network
    <select name="network_id">
      <option value="0">— none —</option>
      {{$foundNetworkID := false}}{{range .Extras.Networks}}{{if eq .ID $.Item.NetworkID}}{{$foundNetworkID = true}}{{end}}<option value="{{.ID}}"{{if eq .ID $.Item.NetworkID}} selected{{end}}>{{.Name}} ({{.CIDR}})</option>{{end}}{{if and (gt .Item.NetworkID 0) (not $foundNetworkID)}}<option value="{{.Item.NetworkID}}" selected>network:{{.Item.NetworkID}} (deleted)</option>{{end}}
    </select>
  </label>
  <label>Start IP<input name="start_ip" value="{{.Item.StartIP}}" placeholder="10.0.0.100"></label>
  <label>End IP<input name="end_ip" value="{{.Item.EndIP}}" placeholder="10.0.0.150"></label>
  <label>Notes<textarea name="notes">{{.Item.Notes}}</textarea></label>
  {{template "customFieldsForm" .Extras.customFields}}
  <div class="actions">
    <button class="btn btn-primary" type="submit">{{.SubmitLabel}}</button>
    <a class="btn" data-list-return href="{{.ReturnURL}}">Cancel</a>
  </div>
</form>
{{end}}
