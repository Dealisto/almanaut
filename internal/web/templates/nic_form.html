{{define "content"}}
<div class="page-header">
  <div class="ph-titles">
    <span class="ph-eyebrow">Infrastructure</span>
    <h1>{{.Heading}}</h1>
  </div>
</div>
{{if .Error}}<div class="error" role="alert" tabindex="-1">{{.Error}}</div>{{end}}
<form class="stack" method="post" action="{{.Action}}">
{{ csrfField }}
<input type="hidden" name="return_to" value="{{.ReturnURL}}">
  <label>Name<input name="name" value="{{.Item.Name}}" placeholder="onboard, X540-T2" required></label>
  <label>Host
    <select name="host_id">
      {{$foundHostID := false}}{{range .Extras.Hosts}}{{if eq .ID $.Item.HostID}}{{$foundHostID = true}}{{end}}<option value="{{.ID}}"{{if eq .ID $.Item.HostID}} selected{{end}}>{{.Name}}</option>{{end}}{{if and (gt .Item.HostID 0) (not $foundHostID)}}<option value="{{.Item.HostID}}" selected>host:{{.Item.HostID}} (deleted)</option>{{end}}
    </select>
  </label>
  <label>Kind
    <select name="kind">
      {{range .Extras.Kinds}}<option value="{{.}}"{{if eq . $.Item.Kind}} selected{{end}}>{{.}}</option>{{end}}
    </select>
  </label>
  <label>Model<input name="model" value="{{.Item.Model}}"></label>
  <label>Serial<input name="serial" value="{{.Item.Serial}}"></label>
  <label>Notes<textarea name="notes">{{.Item.Notes}}</textarea></label>
  {{template "customFieldsForm" .Extras.customFields}}
  <div class="actions">
    <button class="btn btn-primary" type="submit">{{.SubmitLabel}}</button>
    <a class="btn" data-list-return href="{{.ReturnURL}}">Cancel</a>
  </div>
</form>
{{end}}
