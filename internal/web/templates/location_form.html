{{define "content"}}
<div class="page-header">
  <div class="ph-titles">
    <span class="ph-eyebrow">Infrastructure</span>
    <h1>{{.Heading}}</h1>
  </div>
</div>
{{if .Error}}<div class="error" role="alert" tabindex="-1">{{.Error}}</div>{{end}}
<form class="stack" method="post" action="{{.Action}}">
{{ csrfField }}
  <label>Name<input name="name" value="{{.Item.Name}}" required></label>
  <label>Site
    <select name="site_id">
      <option value="0">— none —</option>
      {{$foundSiteID := false}}{{range .Extras.Sites}}{{if eq .ID $.Item.SiteID}}{{$foundSiteID = true}}{{end}}<option value="{{.ID}}"{{if eq .ID $.Item.SiteID}} selected{{end}}>{{.Name}}</option>{{end}}{{if and (gt .Item.SiteID 0) (not $foundSiteID)}}<option value="{{.Item.SiteID}}" selected>site:{{.Item.SiteID}} (deleted)</option>{{end}}
    </select>
  </label>
  <label>Notes<textarea name="notes">{{.Item.Notes}}</textarea></label>
  {{template "customFieldsForm" .Extras.customFields}}
  <div class="actions">
    <button class="btn btn-primary" type="submit">{{.SubmitLabel}}</button>
    <a class="btn" href="/locations">Cancel</a>
  </div>
</form>
{{end}}
